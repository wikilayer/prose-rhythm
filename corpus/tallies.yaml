language: en
anchors:
  flat: &flat He climbed the stairs to the attic. The boxes stood where his father had left them. He opened the first one and found letters tied with string. He read the top letter by the window.
  rain: &rain Rain. Under the eave the stone stayed dry, and she waited there with the basket against her hip while the carts went by one after another, each wheel striking the same broken flag and rolling on as if nothing in the street had ever been broken at all. Then quiet.
  latch: &latch When the last cart had gone she lifted the latch. Inside, nobody moved for a long while. She counted the hooks.
  door: &door Twice the door swung back on her. Slowly, with her shoulder, she held it.
  dialogue: &dialogue “Come,” she said.
