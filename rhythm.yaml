languages:
  en:
    thresholds:
      minimum_sentences: 30
      long_words: 30
      uniform_paragraph_sentences: [4, 6]
      subject_run: 4
    checks:
      - {kind: spread, bound: min, limit: 0.55}
      - {kind: long_sentences, bound: min, limit: 0.04}
      - {kind: uniform_paragraphs, bound: max, limit: 0.5}
      - {kind: subject_runs, bound: max, limit: 0.4}
    word_joiners: "’'-"
    sentence_ends: ".!?…"
    closers: "\"”’')]"
    openers: "\"“‘'([—–"
    quote_pairs:
      - ['"', '"']
      - ["“", "”"]
      - ["‘", "’"]
    dialogue_quoted_share: 0.2
    initial_exceptions:
      - I.
    abbreviations:
      - Mr.
      - Mrs.
      - Ms.
      - Dr.
      - St.
      - Mt.
      - Prof.
